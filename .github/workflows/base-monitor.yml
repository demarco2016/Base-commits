name: Base monitor
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BASE-MONITOR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Read public data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node monitor.js > report.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        with:
          name: base-monitor-report
          path: |
            BASE-MONITOR/report.txt
            BASE-MONITOR/.local/tracked_projects.json
          retention-days: 7
